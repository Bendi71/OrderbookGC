name: Orderbook Integration Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'common/**'
      - 'server/**'
      - 'CMakeLists.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'common/**'
      - 'server/**'
      - 'CMakeLists.txt'
  workflow_dispatch:  # Allow manual triggering

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON ..
    
    - name: Build Tests
      run: |
        cd build
        cmake --build . --config Release
    
    - name: Run All Tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Run Individual Test Suites
      if: always()
      run: |
        cd build/bin
        echo "=== Orderbook Matching Tests ==="
        ./orderbook_matching_test --gtest_output=xml:matching_results.xml
        echo "=== Orderbook Cancel Tests ==="
        ./orderbook_cancel_test --gtest_output=xml:cancel_results.xml
        echo "=== Orderbook Edge Case Tests ==="
        ./orderbook_edge_test --gtest_output=xml:edge_results.xml
        echo "=== Message Serialization Tests ==="
        ./message_test --gtest_output=xml:message_results.xml
        echo "=== Order Unit Tests ==="
        ./order_test --gtest_output=xml:order_results.xml
