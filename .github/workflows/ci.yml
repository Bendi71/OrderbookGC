name: C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: Release

    steps:
    - uses: actions/checkout@v3

    # Install dependencies for Linux
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON ..

    - name: Build
      run: |
        cd build
        cmake --build . --config ${{ env.BUILD_TYPE }}

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C ${{ env.BUILD_TYPE }}

    - name: List build artifacts
      run: |
        echo "Built files:"
        find build -type f -name "*.so" -o -type f -executable | grep -v CMakeFiles | sort
        
        echo "Directory structure:"
        find build -type d | sort